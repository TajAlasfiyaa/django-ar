<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" fill="none">
  <defs>
    <linearGradient id="step" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#44B78B"/>
      <stop offset="1" stop-color="#0C4B33"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F5A3D"/>
      <stop offset="1" stop-color="#0A3826"/>
    </linearGradient>
  </defs>

  <!-- Code window -->
  <rect x="170" y="20" width="230" height="150" rx="14" fill="url(#card)"/>
  <circle cx="190" cy="40" r="5" fill="#FF6B6B"/>
  <circle cx="206" cy="40" r="5" fill="#FFD166"/>
  <circle cx="222" cy="40" r="5" fill="#44B78B"/>
  <rect x="190" y="62" width="58" height="8" rx="4" fill="#44B78B"/>
  <rect x="254" y="62" width="92" height="8" rx="4" fill="#C9F0DD"/>
  <rect x="206" y="82" width="44" height="8" rx="4" fill="#FFD166"/>
  <rect x="256" y="82" width="110" height="8" rx="4" fill="#C9F0DD" fill-opacity=".7"/>
  <rect x="206" y="102" width="70" height="8" rx="4" fill="#FFD166"/>
  <rect x="282" y="102" width="62" height="8" rx="4" fill="#C9F0DD" fill-opacity=".7"/>
  <rect x="190" y="122" width="40" height="8" rx="4" fill="#44B78B"/>
  <rect x="236" y="122" width="120" height="8" rx="4" fill="#C9F0DD"/>
  <rect x="206" y="142" width="84" height="8" rx="4" fill="#C9F0DD" fill-opacity=".5"/>

  <!-- Five steps, rising from right to left: stage 0 to stage 4 -->
  <rect x="330" y="280" width="56" height="40" rx="8" fill="url(#step)" opacity=".45"/>
  <rect x="265" y="250" width="56" height="70" rx="8" fill="url(#step)" opacity=".6"/>
  <rect x="200" y="220" width="56" height="100" rx="8" fill="url(#step)" opacity=".75"/>
  <rect x="135" y="190" width="56" height="130" rx="8" fill="url(#step)" opacity=".9"/>
  <rect x="70" y="160" width="56" height="160" rx="8" fill="url(#step)"/>

  <!-- Flag on the last step -->
  <path d="M98 160V108" stroke="#0C4B33" stroke-width="3" stroke-linecap="round"/>
  <path d="M98 110L130 120L98 132Z" fill="#44B78B"/>
</svg>
