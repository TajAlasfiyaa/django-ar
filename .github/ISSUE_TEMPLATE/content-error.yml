name: خطأ في درس
description: معلومة غير صحيحة، أو كود لا يعمل، أو شرح مربك.
labels: ["content-error"]
body:
  - type: input
    id: lesson
    attributes:
      label: الدرس
      description: رقم الدرس أو رابطه.
      placeholder: "2.4"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: ما الخطأ؟
      description: انسخ الجملة أو الكود، واشرح المشكلة. إن كان كوداً لا يعمل، الصق رسالة الخطأ كاملة.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: ما الصواب؟ (اختياري)
      description: رابط من وثائق Django، أو ناتج تشغيل يثبت ذلك.
